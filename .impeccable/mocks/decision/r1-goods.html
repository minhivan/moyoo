<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:'Be Vietnam Pro',sans-serif;background:#FFF6D8;color:#2A2418;position:relative}
.top{display:flex;justify-content:space-between;padding:52px 18px 10px;font-weight:900;font-size:22px}
.vf{margin:6px 16px 0;height:430px;border-radius:26px;background:url(../../../public/samples/shot2.jpg) center/cover;border:4px solid #fff}
.roster{display:flex;gap:10px;padding:16px 16px 0;overflow:hidden}
.c{flex:0 0 82px;background:#fff;border-radius:18px;padding:8px;text-align:center;font-size:11px;font-weight:800}
.c i{display:block;height:46px;border-radius:50%;margin:0 auto 6px;width:46px}
.c small{display:block;font-weight:600;color:#6B6252;font-size:9px;margin-top:2px}
.c.on{box-shadow:0 0 0 3px #FF8A3D;transform:translateY(-4px)}
.bar{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:space-around;align-items:center}
.bar i{width:48px;height:48px;border-radius:50%;background:#fff}
.sh{width:84px;height:84px;border-radius:50%;background:#2A2418;border:6px solid #fff}
</style></head><body>
<div class="top"><span>moyoo</span><span style="font-size:13px">VI</span></div>
<div class="vf"></div>
<div class="roster">
<div class="c on"><i style="background:#F5E8BA"></i>Butter<small>thích nắng sớm</small></div>
<div class="c"><i style="background:#F0CDCE"></i>Blush<small>hay ngại</small></div>
<div class="c"><i style="background:#1C1B1A"></i>Noir<small>ít nói</small></div>
<div class="c"><i style="background:#CBD5C8"></i>Sage<small>chill</small></div>
</div>
<div class="bar"><i></i><div class="sh"></div><i></i></div>
</body></html>
