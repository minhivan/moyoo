<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:-apple-system,system-ui,sans-serif;background:#000;color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;padding:56px 18px 18px}
.top span{width:40px;height:40px;border-radius:50%;background:#1A1A1A}
.top b{background:#1A1A1A;padding:10px 16px;border-radius:20px;font-size:14px}
.vf{margin:10px 14px 0;aspect-ratio:1;border-radius:40px;background:url(../../../public/samples/shot2.jpg) center/cover}
.bar{display:flex;justify-content:space-around;align-items:center;margin-top:48px}
.bar i{width:40px;height:40px;border-radius:50%;background:#1A1A1A}
.sh{width:84px;height:84px;border-radius:50%;border:4px solid #FFC800;display:grid;place-items:center}.sh:after{content:"";width:66px;height:66px;border-radius:50%;background:#fff}
.hist{text-align:center;margin-top:46px;font-size:14px;font-weight:600}
</style></head><body>
<div class="top"><span></span><b>moyoo</b><span></span></div>
<div class="vf"></div>
<div class="bar"><i></i><div class="sh"></div><i></i></div>
<div class="hist">Lịch sử ⌄</div>
</body></html>
