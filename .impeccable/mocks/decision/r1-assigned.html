<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:'Be Vietnam Pro',sans-serif;color:#141414;background:#E9ECF1;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;padding:52px 18px 10px}
.brand{font-weight:900;font-size:24px;letter-spacing:-.05em;background:#FF5A36;color:#fff;padding:4px 12px 6px;border-radius:12px;box-shadow:0 0 0 4px #fff,0 6px 14px #0002;transform:rotate(-3deg)}
.ic{display:flex;gap:8px}.ic span{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.vf{margin:10px 16px 0;height:468px;border-radius:30px;background:url(../../../public/samples/shot2.jpg) center/cover;box-shadow:0 0 0 6px #fff,0 14px 30px #0002;position:relative}
.vf .count{position:absolute;right:16px;top:14px;font-weight:900;font-size:56px;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 2px 12px #0005}
.reel{position:absolute;left:14px;top:16px;display:flex;gap:5px}.reel i{width:22px;height:30px;border-radius:6px;background:#ffffff55;border:2px solid #fff}.reel i.f{background:url(../../../public/samples/shot1.jpg) center/cover}
.modes{display:flex;justify-content:center;gap:10px;margin-top:20px}
.modes span{font-size:13px;font-weight:700;padding:9px 14px;border-radius:999px;color:#4A4F57}
.modes b{font-size:13px;font-weight:800;padding:9px 16px;border-radius:999px;background:#2E6BFF;color:#fff;box-shadow:0 0 0 3px #fff,0 6px 12px #2E6BFF44;transform:rotate(-2deg)}
.chips{display:flex;gap:8px;justify-content:center;margin-top:14px}
.chips span{font-size:12px;font-weight:700;padding:8px 12px;border-radius:12px;background:#fff}
.bar{position:absolute;left:0;right:0;bottom:30px;display:flex;align-items:center;justify-content:space-around}
.thumb{width:50px;height:50px;border-radius:14px;background:url(../../../public/samples/shot3.jpg) center/cover;box-shadow:0 0 0 3px #fff}
.sh{width:86px;height:86px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 8px 18px #0002}.sh:after{content:"";width:68px;height:68px;border-radius:50%;background:#FF5A36}
.flip{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:18px}
</style></head><body>
<div class="top"><div class="brand">moyoo</div><div class="ic"><span>VI</span><span>♪</span></div></div>
<div class="vf"><div class="reel"><i class="f"></i><i></i><i></i><i></i></div><div class="count">3</div></div>
<div class="modes"><span>1 tấm</span><b>Dải 4</b><span>Lưới 2×2</span></div>
<div class="chips"><span>Khung Kem</span><span>Film</span><span>3s</span></div>
<div class="bar"><div class="thumb"></div><div class="sh"></div><div class="flip">⟲</div></div>
</body></html>
