<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:'Be Vietnam Pro',sans-serif;color:#17161C;
background:#F6F7FB;background-image:linear-gradient(#E4E1F4 1px,transparent 1px),linear-gradient(90deg,#EDEBF8 1px,transparent 1px);background-size:100% 22px,22px 100%}
.top{display:flex;align-items:center;justify-content:space-between;padding:54px 20px 12px}
.brand{font-weight:800;font-size:26px;letter-spacing:-.04em;color:#5B3FD1}
.pill{display:flex;gap:8px}.pill span{height:36px;min-width:36px;border-radius:18px;background:#fff;border:1px solid #E1DFEA;display:grid;place-items:center;font-size:12px;font-weight:600}
.vf{margin:8px 16px 0;height:470px;border-radius:36px;overflow:hidden;position:relative;background:url(../../../public/samples/shot2.jpg) center/cover,#ccc}
.vf .count{position:absolute;inset:0;display:grid;place-items:center;font-size:140px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 4px 30px #0004}
.vf .tag{position:absolute;left:14px;top:14px;background:#17161Ccc;color:#fff;font-size:13px;font-weight:600;padding:8px 12px;border-radius:14px}
.cells{display:flex;gap:6px;justify-content:center;margin:14px 0 0}
.cells i{width:34px;height:26px;border-radius:7px;border:1.5px solid #CFCBE6;background:#fff}
.cells i.f{background:url(../../../public/samples/shot1.jpg) center/cover;border-color:#5B3FD1}
.modes{display:flex;justify-content:center;gap:22px;margin:14px 0 0;font-size:13px;font-weight:700;letter-spacing:.04em;color:#8A879A}
.modes b{color:#5B3FD1;position:relative}
.modes b:after{content:"";position:absolute;inset:-7px -12px;border:2px solid #5B3FD1;border-radius:50%;transform:rotate(-4deg)}
.bar{position:absolute;left:0;right:0;bottom:30px;display:flex;align-items:center;justify-content:space-around}
.thumb{width:48px;height:48px;border-radius:14px;background:url(../../../public/samples/shot3.jpg) center/cover;border:2px solid #fff;box-shadow:0 0 0 1px #E1DFEA}
.shutter{width:84px;height:84px;border-radius:50%;border:4px solid #5B3FD1;display:grid;place-items:center;background:#fff}
.shutter:after{content:"";width:64px;height:64px;border-radius:50%;background:#17161C}
.flip{width:48px;height:48px;border-radius:50%;background:#fff;border:1px solid #E1DFEA;display:grid;place-items:center;font-size:20px}
.chips{display:flex;gap:8px;justify-content:center;margin-top:16px}
.chips span{font-size:12px;font-weight:600;padding:8px 12px;border-radius:14px;background:#fff;border:1px solid #E1DFEA}
.chips span em{font-style:normal;color:#5B3FD1}
</style></head><body>
<div class="top"><div class="brand">moyoo</div><div class="pill"><span>VI</span><span>♪</span></div></div>
<div class="vf"><div class="tag">Ảnh 2 / 4</div><div class="count">3</div></div>
<div class="cells"><i class="f"></i><i></i><i></i><i></i></div>
<div class="modes"><span>1 TẤM</span><b>DẢI 4</b><span>LƯỚI 2×2</span></div>
<div class="chips"><span>Khung · <em>Kem</em></span><span>Lọc · <em>Film</em></span><span>Hẹn · <em>3s</em></span></div>
<div class="bar"><div class="thumb"></div><div class="shutter"></div><div class="flip">⟲</div></div>
</body></html>
