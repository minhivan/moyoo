<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:'Be Vietnam Pro',sans-serif;background:#FFE3F1;color:#3A1730;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;padding:52px 18px 10px}
.brand{font-weight:900;font-size:26px;color:#FF3E9A;letter-spacing:-.04em}
.top span{background:#fff;border-radius:16px;padding:8px 12px;font-size:12px;font-weight:800}
.vf{margin:8px 16px 0;height:470px;border-radius:28px;background:url(../../../public/samples/shot2.jpg) center/cover;border:5px solid #fff;position:relative}
.vf em{position:absolute;font-style:normal;font-size:28px}
.modes{display:flex;justify-content:center;gap:8px;margin-top:18px}
.modes span{background:#fff;border-radius:16px;padding:9px 14px;font-size:13px;font-weight:800;color:#B05A8C}
.modes b{background:#7A3CFF;color:#fff;border-radius:16px;padding:9px 14px;font-size:13px}
.bar{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:space-around;align-items:center}
.bar i{width:50px;height:50px;border-radius:16px;background:#fff}
.sh{width:86px;height:86px;border-radius:50%;background:#FF3E9A;border:6px solid #fff;box-shadow:0 0 0 3px #FF3E9A}
</style></head><body>
<div class="top"><div class="brand">moyoo♡</div><span>VI</span></div>
<div class="vf"><em style="left:14px;top:12px">★</em><em style="right:18px;bottom:16px">♡</em></div>
<div class="modes"><span>1 tấm</span><b>Dải 4</b><span>2×2</span></div>
<div class="bar"><i></i><div class="sh"></div><i></i></div>
</body></html>
