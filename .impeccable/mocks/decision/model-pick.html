<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:'Be Vietnam Pro',sans-serif;background:#0E0E10;color:#F4F4F2}
.top{display:flex;justify-content:space-between;align-items:center;padding:54px 20px 14px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.03em}
.top span{font-size:12px;color:#9A9AA2}
.vf{margin:6px 22px 0;height:440px;border-radius:30px;background:url(../../../public/samples/shot2.jpg) center/cover;box-shadow:0 0 0 2px #ffffff22,0 0 60px 10px #ffffff1c}
.modes{display:flex;justify-content:center;gap:24px;margin-top:22px;font-size:12px;font-weight:600;letter-spacing:.08em;color:#6E6E78}
.modes b{color:#F4F4F2}
.bar{display:flex;justify-content:space-around;align-items:center;margin-top:30px}
.thumb{width:46px;height:46px;border-radius:12px;background:url(../../../public/samples/shot3.jpg) center/cover}
.sh{width:82px;height:82px;border-radius:50%;border:4px solid #F4F4F2;display:grid;place-items:center}.sh:after{content:"";width:64px;height:64px;border-radius:50%;background:#F4F4F2}
.flip{width:46px;height:46px;border-radius:50%;background:#1C1C20;display:grid;place-items:center}
.slot{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:120px;height:44px;border-radius:12px 12px 0 0;background:#1C1C20;overflow:hidden}
.slot i{display:block;margin:8px auto 0;width:70px;height:60px;background:#F0CDCE;border-radius:3px}
</style></head><body>
<div class="top"><div class="brand">moyoo</div><span>VI · ♪</span></div>
<div class="vf"></div>
<div class="modes"><span>1 TẤM</span><b>DẢI 4</b><span>LƯỚI 2×2</span></div>
<div class="bar"><div class="thumb"></div><div class="sh"></div><div class="flip">⟲</div></div>
<div class="slot"><i></i></div>
</body></html>
